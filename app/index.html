<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Client</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f3f4f6;
    }

    main {
      width: min(100%, 720px);
      padding: 48px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .status {
      display: inline-block;
      margin-bottom: 24px;
      padding: 7px 12px;
      color: #166534;
      background: #dcfce7;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(32px, 6vw, 56px);
      color: #0f766e;
    }

    p {
      margin: 0 0 12px;
      font-size: 18px;
      line-height: 1.6;
    }

    small {
      display: block;
      margin-top: 32px;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <main>
    <span class="status">Sistema operativo</span>

    <h1>Asset Client</h1>

    <p>Portale per la gestione di clienti, filiali e dispositivi.</p>
    <p>La prima versione dell’applicazione è stata pubblicata correttamente.</p>

    <small>Versione iniziale 0.1.0</small>
  </main>
</body>
</html>
